#####################################################################
# NH36 toolhead filament insertion sensor
# Auto-load only — NEVER pauses a print
#####################################################################

[filament_switch_sensor toolhead_filament_sensor]
switch_pin: ^nhk:PC15
pause_on_runout: False
event_delay: 3.0

insert_gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        RESPOND MSG="Filament detected - starting automatic load"
        TOOLHEAD_AUTO_LOAD
    {% else %}
        RESPOND MSG="Filament sensor triggered during print - ignored"
    {% endif %}

runout_gcode:
    # Intentionally do nothing.
    # This sensor is NOT used for print pausing.
    RESPOND MSG="Filament left toolhead sensor - no pause"


#####################################################################
# Automatic filament loading
#####################################################################

[gcode_macro TOOLHEAD_AUTO_LOAD]
description: Automatically heat and load filament while printer is idle
variable_load_temp: 220
variable_load_distance: 35
variable_purge_distance: 15

gcode:
    {% set load_temp = params.TEMP|default(printer["gcode_macro TOOLHEAD_AUTO_LOAD"].load_temp)|int %}
    {% set load_distance = params.LOAD|default(printer["gcode_macro TOOLHEAD_AUTO_LOAD"].load_distance)|float %}
    {% set purge_distance = params.PURGE|default(printer["gcode_macro TOOLHEAD_AUTO_LOAD"].purge_distance)|float %}

    # Never interfere with an active or paused print
    {% if printer.print_stats.state in ["printing", "paused"] %}

        RESPOND MSG="Auto-load ignored - print is active"

    {% else %}

        # Heat only if required
        {% if printer.extruder.temperature < load_temp %}
            RESPOND MSG="Heating nozzle to {load_temp}C"
            M109 S{load_temp}
        {% endif %}

        RESPOND MSG="Loading filament"

        SAVE_GCODE_STATE NAME=toolhead_load_state

        M83
        G92 E0

        # Load toward hotend
        G1 E{load_distance} F600

        # Slow purge through nozzle
        G1 E{purge_distance} F180

        G92 E0

        RESTORE_GCODE_STATE NAME=toolhead_load_state

        RESPOND MSG="Automatic filament load complete"

    {% endif %}