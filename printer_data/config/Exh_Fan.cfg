#####################################################################
# Automatic Exhaust Fan Control
#
# Behavior:
# - NH temperature >= 60°C: exhaust runs at 100%
# - Chamber temperature >= 40°C: exhaust runs at 20%
# - Hysteresis prevents rapid on/off speed switching
#####################################################################
#exhaust fan
[fan_generic fan2]               # exhaust fan 
pin: PD14
cycle_time: 0.00003
hardware_pwm: false
kick_start_time: 0.5
shutdown_speed: 0.0
max_power: 1.0


[delayed_gcode EXHAUST_TEMP_CONTROL]
initial_duration: 5.0
gcode:
    {% set nh_temp = printer["temperature_sensor nh_temp"].temperature|float %}
    {% set chamber_temp = printer["heater_generic chamber_heater"].temperature|float %}
    {% set current_speed = printer["fan_generic exhaust_fan"].speed|float %}

    # Nitehawk protection has highest priority
    {% if nh_temp >= 60.0 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0

    # Keep full speed until NH cools below 57°C
    {% elif current_speed > 0.90 and nh_temp > 57.0 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0

    # Normal chamber ventilation
    {% elif chamber_temp >= 40.0 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0.20

    # Keep low speed until chamber cools below 38°C
    {% elif current_speed > 0.0 and chamber_temp > 38.0 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0.20

    # Both temperatures are safely below thresholds
    {% else %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0.0
    {% endif %}

    UPDATE_DELAYED_GCODE ID=EXHAUST_TEMP_CONTROL DURATION=5.0