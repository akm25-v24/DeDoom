#####################################################################
# DEDOOM - H2D STYLE STATUS / PROGRESS BAR
# 18x WS2812B on PB10
#####################################################################

[display_status]


#####################################################################
# NEOPIXEL
#####################################################################

[neopixel status_leds]
pin: PB10
chain_count: 18
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0


#####################################################################
# LED EFFECTS
#####################################################################

# --------------------------------------------------
# IDLE / READY
# Dim purple
# --------------------------------------------------

[led_effect status_idle]
leds:
    neopixel:status_leds
autostart: true
frame_rate: 12
layers:
    static 0 0 top (0.08,0.02,0.12)


# --------------------------------------------------
# HOMING
# Pulsating blue
# --------------------------------------------------

[led_effect status_homing]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 24
layers:
    breathing 1.5 0 top (0.0,0.10,1.0)


# --------------------------------------------------
# Z TILT
# Pulsating blue
# --------------------------------------------------

[led_effect status_leveling]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 24
layers:
    breathing 1.5 0 top (0.0,0.10,1.0)


# --------------------------------------------------
# BED MESH
# Pulsating cyan
# --------------------------------------------------

[led_effect status_meshing]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 24
layers:
    breathing 1.5 0 top (0.0,0.65,1.0)


# --------------------------------------------------
# HEATING
# Pulsating orange
# --------------------------------------------------

[led_effect status_heating]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 24
layers:
    breathing 2.0 0 top (1.0,0.15,0.0)


# --------------------------------------------------
# SUCCESS
# Green
# --------------------------------------------------

[led_effect status_success]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 12
layers:
    static 0 0 top (0.0,0.85,0.05)


# --------------------------------------------------
# PRINTING
# H2D style progress bar
# --------------------------------------------------

[led_effect status_printing]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 24
layers:
    progress -1 0 add (0.0,0.75,1.0),(0.0,0.15,0.65)
    static    0 0 top (0.0,0.0,0.035)


# --------------------------------------------------
# PAUSED
# Pulsating yellow
# --------------------------------------------------

[led_effect status_paused]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 24
layers:
    breathing 2.0 0 top (1.0,0.50,0.0)


# --------------------------------------------------
# PRINT COMPLETE
# Green breathing
# --------------------------------------------------

[led_effect status_complete]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 20
layers:
    breathing 2.5 0 top (0.0,1.0,0.05)


# --------------------------------------------------
# ERROR
# Red strobe
# --------------------------------------------------

[led_effect status_error]
leds:
    neopixel:status_leds
autostart: false
frame_rate: 24
layers:
    strobe 1 1.5 top (1.0,0.0,0.0)


#####################################################################
# STATUS CONTROL MACROS
#####################################################################

[gcode_macro STATUS_READY]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_idle RESTART=1


[gcode_macro STATUS_HOMING]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_homing RESTART=1


[gcode_macro STATUS_LEVELING]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_leveling RESTART=1


[gcode_macro STATUS_MESHING]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_meshing RESTART=1


[gcode_macro STATUS_HEATING]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_heating RESTART=1


[gcode_macro STATUS_SUCCESS]
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_success RESTART=1

    # Keep green visible for 3 seconds
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=3


[gcode_macro STATUS_PRINTING]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_printing RESTART=1


[gcode_macro STATUS_PAUSED]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_paused RESTART=1


[gcode_macro STATUS_COMPLETE]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_complete RESTART=1


[gcode_macro STATUS_ERROR]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED_EFFECT EFFECT=status_error RESTART=1


[gcode_macro STATUS_OFF]
gcode:
    UPDATE_DELAYED_GCODE ID=status_return_ready DURATION=0
    STOP_LED_EFFECTS LEDS="neopixel:status_leds"
    SET_LED LED=status_leds RED=0 GREEN=0 BLUE=0 SYNC=0


#####################################################################
# RETURN TO READY AFTER SUCCESS
#####################################################################

[delayed_gcode status_return_ready]
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        STATUS_READY
    {% endif %}


#####################################################################
# AUTOMATIC PRINT-STATE WATCHER
#
# This is the automation we added previously.
# It now changes LEDs only when print state changes,
# so it does NOT restart the effect every second.
#####################################################################

[gcode_macro _STATUS_VARS]
variable_last_print_state: "unknown"
gcode:


[delayed_gcode status_led_watcher]
initial_duration: 1.0
gcode:
    {% set state = printer.print_stats.state|string %}
    {% set last = printer["gcode_macro _STATUS_VARS"].last_print_state|string %}

    {% if state != last %}

        {% if state == "printing" %}
            STATUS_PRINTING

        {% elif state == "paused" %}
            STATUS_PAUSED

        {% elif state == "complete" %}
            STATUS_COMPLETE

        {% elif state == "error" %}
            STATUS_ERROR

        {% elif state in ["standby", "ready"] %}
            STATUS_READY

        {% endif %}

        SET_GCODE_VARIABLE MACRO=_STATUS_VARS VARIABLE=last_print_state VALUE='"{state}"'

    {% endif %}

    UPDATE_DELAYED_GCODE ID=status_led_watcher DURATION=1


#####################################################################
# AUTOMATIC HOMING STATUS
#
# This lets KlipperScreen/Mainsail native G28 automatically:
# BLUE PULSE -> GREEN -> READY
#
# IMPORTANT:
# Do not use this if you already have a [homing_override]
# or another [gcode_macro G28].
#####################################################################
   
# SAFE Z-TILT STATUS WRAPPER
#
# DO NOT override native Z_TILT_ADJUST.
# We already proved that an old Z_TILT wrapper caused problems.
#
# Use:
# Z_TILT_WITH_STATUS
#####################################################################

[gcode_macro Z_TILT_WITH_STATUS]
description: Run native Z tilt with status LEDs
gcode:
    STATUS_LEVELING

    Z_TILT_ADJUST

    STATUS_SUCCESS


#####################################################################
# OPTIONAL BED MESH STATUS WRAPPER
#####################################################################

[gcode_macro MESH_WITH_STATUS]
description: Run bed mesh with status LEDs
gcode:
    STATUS_MESHING

    BED_MESH_CALIBRATE

    STATUS_SUCCESS