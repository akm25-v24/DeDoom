#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
home_xy_position:150,150
speed:100
z_hop:10

[z_tilt]
##  Use Z_TILT_ADJUST to level the bed .
##  z_positions: Location of toolhead

##--------------------------------------------------------------------
## Uncomment below for 300mm build
z_positions:
   -50, 18
   150, 348
   350, 18
points:
   30, 5
   150, 245
   270, 5
##--------------------------------------------------------------------

speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075


########################################
# Print related Macro
########################################

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    Z_TILT_ADJUST  ; Use QUAD_GANTRY_LEVEL for Trident instead of Z_TILT_ADJUST
    G28
    G0 X150 Y150 Z30 F3600

[gcode_macro DRAW_LINES]
description: "Prime nozzle with two long parallel lines across the front edge"
gcode:
    M117 Priming...

    G90
    G92 E0

    ; -------------------------------
    ; Move to front-left start
    ; -------------------------------
    G1 X20 Y5 Z0.28 F6000

    ; -------------------------------
    ; FIRST LINE (Left → Right)
    ; ~260mm long
    ; -------------------------------
    M83                     ; relative mode
    G1 E8 F300              ; initial purge blob
    G1 X280 Y5 Z0.28 F1800 E35

    ; -------------------------------
    ; Shift up slightly for second line
    ; -------------------------------
    G1 X280 Y7 Z0.28 F3000
    G1 E1 F300              ; micro purge

    ; -------------------------------
    ; SECOND LINE (Right → Left)
    ; same length, parallel
    ; -------------------------------
    G1 X20 Y7 Z0.28 F1800 E35

    ; -------------------------------
    ; Cleanup
    ; -------------------------------
    G92 E0
    G90

[gcode_macro PRINT_START]
gcode:
  {% set target_bed = params.BED|int %}                  # Target bed temperature
  {% set target_extruder = params.EXTRUDER|int %}        # Target nozzle temperature
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}  # Bed center X
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}  # Bed center Y

  SET_GCODE_OFFSET Z=0                                   # Reset Z offset

  # Start heating bed and nozzle simultaneously (non-blocking)
  M140 S{target_bed}                                      # Preheat bed to target
  M104 S150                                               # Preheat nozzle to 150°C

  G28                                                    # Home all axes
  G90                                                    # Set to absolute positioning

  M190 S{target_bed}                                     # Wait for bed to reach target temperature

  ; *** SCRUB FIRST, BEFORE PROBING ***
  #CLEAN_NOZZLE

  ; -------------------------------
  ; Level the gantry using TAP
  ; -------------------------------
  Z_TILT_ADJUST                                      # For Trident with TAP probe

  ; -------------------------------
  ; Load existing bed mesh profile
  ; -------------------------------
  BED_MESH_CLEAR
  M117 Loading mesh...
  BED_MESH_PROFILE LOAD=default100

  # Home Z with probe after leveling
  G28 Z

  ; Heat nozzle to print temp
  M117 Heating nozzle...
  M109 S{target_extruder}

  ; Prime lines
  DRAW_LINES

  ; Ensure known fan state – Orca will set as needed
  M107
  M117 Printing...
  SKEW_PROFILE LOAD=Califlower



[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}
  SET_SKEW CLEAR=1
  SAVE_GCODE_STATE NAME=STATE_PRINT_END

  M400
  G92 E0
  G91
  G1 E-3 F1800
  G1 Z{z_safe - th.position.z} F1200
  G90

  G0 X{x_safe} Y{y_safe} F20000
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park rear center

  TURN_OFF_HEATERS

  M107
  ; Optional exhaust burst:
  ; M106 P3 S255
  ; G4 S300
  ; M106 P3 S0

  BED_MESH_CLEAR
  RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
  M117 Print complete
#--------------------------------------------------------------------
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 
#--------------------------------------------------------------------
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}
#--------------------------------------------------------------------

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
    G28 Y                                     ; Home Y axis
    _TOOLHEAD_PARK_PAUSE_CANCEL               ; Park toolhead
    TURN_OFF_HEATERS                          ; Turn off all heaters
    CANCEL_PRINT_BASE                         ; Cancel the print

    ; Stop part + aux cooling
    M107
    ; Stop exhaust/filter too (Option A uses P3 for exhaust)
    M106 P3 S0

[gcode_macro LOAD_FILAMENT]
description: Load filament safely with heating, purge, and controlled speeds
# Usage: LOAD_FILAMENT TEMP=220 PURGE=40
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}
    {% set PURGE = params.PURGE|default(40)|int %}

    M117 Loading filament...
    M104 S{TEMP}

    # Move to safe area
    G91
    G1 Z10 F3000        ; lift 10mm
    G90
    G1 X20 Y20 F6000    ; front-left corner

    M109 S{TEMP}        ; wait for temp

    # Slow load until filament grabs
    G91
    G1 E20 F300         ; slow push
    G1 E20 F600         ; medium push

    # Prime / purge
    G1 E{PURGE} F1500

    G90
    M117 Filament loaded

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament safely with heating, retract, and full pullout
# Usage: UNLOAD_FILAMENT TEMP=220
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}

    M117 Unloading filament...
    M104 S{TEMP}

    # Move to safe position
    G91
    G1 Z10 F3000
    G90
    G1 X20 Y20 F6000

    M109 S{TEMP}        ; wait for temp

    G91
    G1 E5 F300          ; relieve pressure
    G1 E-20 F1500       ; fast retract from melt zone
    G1 E-80 F3000       ; pull filament fully out

    G90
    M117 Filament unloaded

