[include moongate.cfg]

# =========================
# Voron Trident 300 Cube - BTT Octopus Pro 1.1
# 300 build Cube
# Chamber heater
# Bed Fans
# Exhaust Fan
# Fume Pack
# Logic/board 24V
# Beacon H for Z probe/endstop
# Bed via SSR, control pin on HE1
# 48Volt XY
# back_up test
# =========================
# host MCU service is preinstalled and ready to use with:
[include mainsail.cfg]
#[include Toolhead_FS.cfg]
[include tacho_macros.cfg]
[axis_twist_compensation]
[include KAMP_Settings.cfg]
[include TEST_SPEED.cfg]
[include bed_Fans.cfg]
[include Exh_Fan.cfg]
[include H2D_Status.cfg]
[skew_correction]
[virtual_sdcard]
path: /home/voron/printer_data/gcodes

[gcode_arcs]
resolution: 0.1                         # Arc interpolation resolution, handles G2/G3 commands
[exclude_object]                        # Exclude object for cancellation
[force_move]
enable_force_move: true                 # Enable force move feature



[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_04002B000951313339373836-if00
restart_method: command
#-------------------------------------------------------------------------------
[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_17000E00115330374E333320-if00
restart_method: command
#-------------------------------------------------------------------------------
[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial:/dev/serial/by-id/usb-Klipper_stm32g0b1xx_1F0053000351353032333039-if00
restart_method: command
##--------------------------------------------------------------------
[printer]
kinematics: corexy
max_velocity: 600           # failed at 650
max_accel: 40000    	    # test stopped at 50k , input shaper 11.5 k for y and 14k for x
max_z_velocity: 20 			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: nhk:PB0
position_min: 0
position_endstop: 300          # homing at Xmax (right side)
position_max: 300
homing_speed: 80
homing_retract_dist: 5
homing_positive_dir: true      # move toward +X when homing

[tmc5160 stepper_x]
cs_pin: PC4
spi_bus: spi1
run_current: 2.1
interpolate: false
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PG13              # Y endstop on Manta PF3 (already wired)
position_min: 0
position_endstop: 305          # homing at Ymax (back)
position_max: 305
homing_speed: 80
homing_retract_dist: 5
homing_positive_dir: true      # move toward +Y when homing

[tmc5160 stepper_y]
cs_pin: PD11
spi_bus: spi1
run_current: 2.1
interpolate: false
stealthchop_threshold: 0

#####################################################################
# 	Z Stepper Settings
#####################################################################

##  Z0 Stepper - Front Left
##  Connected to MOTOR_2
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 4
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 300
position_min: -5
homing_speed: 8.0
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: False
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Center
##  Connected to MOTOR_5
[stepper_z1]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PE4
interpolate: False
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Front Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: False
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Extruder
#####################################################################
[extruder]
step_pin: nhk:PB8
dir_pin: !nhk:PB9
enable_pin: !nhk:PC14
rotation_distance: 47.32344   #Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
gear_ratio: 9:1               #BMG Gear Ratio
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.036
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
heater_pin: nhk:PA7             # Heater pin NH
## Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder TARGET=245"
sensor_type: PT1000 #ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:PB12     # On NH
pullup_resistor: 2200
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 420
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
min_extrude_temp: 170                # Minimum extrude temperature


[tmc2209 extruder]   
sense_resistor: 0.100
uart_pin: nhk:PB7
tx_pin: nhk:PB6
#diag_pin: nhk:PC13
interpolate: false
run_current: 0.5     #recommend setting below 0.7A.


[verify_heater extruder]             # Heater block temperature tolerance configuration
max_error: 120                       # Maximum error
check_gain_time: 120                 # Tolerance time
hysteresis: 50                       # Tolerance temperature
heating_gain: 2                      # Heating gain

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##  SSR Pin - HE1
##  Thermistor - TB
heater_pin: PA3
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type:ATC Semitec 104GT-2
sensor_pin: PF3
##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  If max_power is greater than 1.0, use 1.0
max_power: 1.0
min_temp: 0
max_temp: 140
pwm_cycle_time: 0.02227 # 44.9Hz
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[verify_heater heater_bed]
# Allow more time for a slow-heating bed (default is 60s)
check_gain_time: 120

# Require a 2 °C rise in that time (default is 2°C)
heating_gain: 2

# Permit a larger cumulative error before shutdown
# (°C·sec above the allowed hysteresis band; default 120)
max_error: 500

#####################################################################
##                          Idle Timeout for Heated Bed
#####################################################################

[idle_timeout]
timeout: 1800                # Turn off heated bed if idle for more than 30 minutes


#####################################################################
#   Probe
#####################################################################

[probe]
##  CNC TAP Chiaoticlab
##  Connected to Z-PROBE
##  This probe is not used for Z height, only Quad Gantry Leveling
pin: nhk:PC15
x_offset: 0
y_offset: 25.0
#z_offset: 0
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

####################################################################################
##                               Probe Calibration Macro
####################################################################################
[gcode_macro PROBECALIBRATE]
# Defines a G-code macro for probe calibration
gcode:
    G28                          # Home all axes
    G0 X150 Y150 Z1 F3600        # Fast move to X150 Y150 Z1 at 3600 mm/min
    PROBE_CALIBRATE              # Start probe calibration

#####################################################################
#   Thermistors
# #####################################################################
[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

# Dock Thermistor
[temperature_sensor elect_temp]
## Deck Temperature - T2
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF6
pullup_resistor: 2200
min_temp: 0
max_temp: 100
gcode_id: Elec_th

[temperature_sensor Toolhead_temp]
## Toolhead thermistor
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:PB2
pullup_resistor: 4700
min_temp: 0
max_temp: 100
gcode_id: Toolhead_th


## Step A Thermistor
[temperature_sensor stepA_temp]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: expander:PA5   # klipper expander TH1
pullup_resistor: 2200
min_temp: 0
max_temp: 110
gcode_id: StA_th

## Step B Thermistor
[temperature_sensor StepB_temp]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: expander:PA6    # klipper expander TH0
pullup_resistor: 2200
min_temp: 0
max_temp: 110
gcode_id: StB_th

######################
### Chamber Heater ###
######################

# Heater-body thermistor safety monitor
[temperature_sensor chamber_heater_body]
sensor_type: Generic 3950
sensor_pin: PF4                  # T0 - heater body thermistor
min_temp: 0
max_temp: 150
gcode_id: CH_HEATER_BODY


# Chamber heater - controls chamber AIR temperature
# HE2 and sensor to T1
#[heater_generic chamber_heater]
#heater_pin: PB0
#sensor_type: ATC Semitec 104GT-2
#sensor_pin:PF5
#control: watermark
#max_power: 0.40
#min_temp: 0
#max_temp: 85
[heater_generic chamber_heater]
gcode_id: C
heater_pin: PB0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF5
control: watermark
max_power: 0.40
min_temp: 0
max_temp: 85


# Chamber circulation / heater assist fan
[heater_fan chamber_heater_fan]
pin: PB11                         # HE3
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5
heater: chamber_heater
heater_temp: 55.0
fan_speed: 1.0


# Chamber heater verification
# Chamber air heats slowly, so these values must be relaxed
[verify_heater chamber_heater]
max_error: 300
check_gain_time: 480
hysteresis: 5
heating_gain: 1


####################################
### Chamber Heater Safety Monitor ###
####################################

[gcode_macro _CHAMBER_HEATER_SAFETY]
variable_trip: 140
gcode:
    {% set t = printer["temperature_sensor chamber_heater_body"].temperature|float %}
    {% if t >= printer["gcode_macro _CHAMBER_HEATER_SAFETY"].trip %}
        { action_respond_info("CHAMBER HEATER BODY OVERTEMP %.1fC - EMERGENCY STOP" % (t)) }
        M112
    {% endif %}


[delayed_gcode CHAMBER_HEATER_WATCHDOG]
initial_duration: 2.0
gcode:
    _CHAMBER_HEATER_SAFETY
    UPDATE_DELAYED_GCODE ID=CHAMBER_HEATER_WATCHDOG DURATION=2.0


##############################
### Orca Chamber Support #####
##############################

# Allows Orca's M191 chamber command to work with Klipper
[gcode_macro M191]
description: Wait for chamber temperature
gcode:
    {% set TARGET = params.S|default(0)|float %}
    {% if TARGET > 0 %}
        M117 Waiting for chamber {TARGET}C
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={TARGET}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={TARGET}
    {% endif %}


[gcode_macro CHAMBER_OFF]
description: Turn chamber heater off
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0


